# Build all service images → Docker Hub → SSH deploy to two EC2 hosts (web + workers).
# nextjs-web image: pass NEXT_PUBLIC_* build-args (vars/secrets below) so the browser bundle
# is not stuck on dummy.supabase.co. Runtime EC2 .env is not enough for client-side Supabase.
# Web host: Caddy terminates TLS (Let's Encrypt) for APP_DOMAIN; reverse-proxies to Next on :3000.
# Ensures /app, writes docker-compose.yml + Caddyfile from DOCKERHUB_USERNAME and APP_DOMAIN,
# uploads .env from secrets, then compose pull + up. See docs/github-actions-environment.md
name: deploy-ec2

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-ec2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build-and-push:
    name: 'Image: ${{ matrix.image }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: nextjs-web, image: recruitai-nextjs-web }
          - { service: executor-worker, image: recruitai-executor-worker }
          - { service: cv-parser-worker, image: recruitai-cv-parser-worker }
          - { service: evaluator-worker, image: recruitai-evaluator-worker }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub configuration
        run: |
          if [ -z "${DOCKERHUB_USER}" ]; then
            echo "::error::Set repository variable DOCKERHUB_USERNAME to your Docker Hub namespace."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Set repository secret DOCKERHUB_TOKEN (Docker Hub access token)."
            exit 1
          fi
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Next.js public env for web Docker build
        if: matrix.service == 'nextjs-web'
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL != '' && vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${URL}" ]; then
            echo "::error::Set variable or secret NEXT_PUBLIC_SUPABASE_URL for CI."
            exit 1
          fi
          if [ -z "${ANON}" ]; then
            echo "::error::Set secret NEXT_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ (vars.DOCKERHUB_USERNAME != '' && vars.DOCKERHUB_USERNAME) || 'unconfigured' }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ (github.ref_name == 'main' || github.ref_name == 'master') && github.event_name == 'push' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./services/${{ matrix.service }}
          push: ${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL != '' && vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_VAPI_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPI_PUBLIC_KEY != '' && vars.NEXT_PUBLIC_VAPI_PUBLIC_KEY || secrets.NEXT_PUBLIC_VAPI_PUBLIC_KEY }}
            NEXT_PUBLIC_VAPI_ASSISTANT_ID=${{ vars.NEXT_PUBLIC_VAPI_ASSISTANT_ID != '' && vars.NEXT_PUBLIC_VAPI_ASSISTANT_ID || secrets.NEXT_PUBLIC_VAPI_ASSISTANT_ID }}

      - name: Image digest
        run: echo "Digest ${{ steps.build.outputs.digest }}"

  deploy-web:
    needs: build-and-push
    # Job-level `if` cannot reference `secrets` (GitHub restriction). Gate on vars; validate secrets in steps.
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check web deploy secrets
        env:
          HOST: ${{ secrets.WEB_EC2_IP }}
          KEY: ${{ secrets.SSH_KEY }}
          DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          if [ -z "${HOST}" ]; then
            echo "::error::Set repository secret WEB_EC2_IP."
            exit 1
          fi
          if [ -z "${KEY}" ]; then
            echo "::error::Set repository secret SSH_KEY."
            exit 1
          fi
          if [ -z "${DOMAIN}" ]; then
            echo "::error::Set repository variable APP_DOMAIN (e.g. recruit.saadzafar.dev)."
            exit 1
          fi

      - name: Prepare docker-compose.yml, Caddyfile, and web.env
        run: |
          set -euo pipefail
          if [ -z "${EC2_WEB_ENV_FILE:-}" ]; then
            echo "::error::Set repository secret EC2_WEB_ENV_FILE."
            exit 1
          fi
          D="${GITHUB_WORKSPACE}/ec2-deploy-web"
          mkdir -p "$D"
          NS="${DOCKERHUB_NS}"
          DOMAIN="${APP_DOMAIN}"

          # Write compose/Caddy without heredoc body indentation (YAML would otherwise get leading spaces).
          {
            printf '%s\n' \
              'services:' \
              '  web:' \
              "    image: ${NS}/recruitai-nextjs-web:latest" \
              '    expose:' \
              '      - "3000"' \
              '    env_file: .env' \
              '    restart: always' \
              '' \
              '  caddy:' \
              '    image: caddy:2-alpine' \
              '    depends_on:' \
              '      - web' \
              '    ports:' \
              '      - "80:80"' \
              '      - "443:443"' \
              '      - "443:443/udp"' \
              '    volumes:' \
              '      - ./Caddyfile:/etc/caddy/Caddyfile' \
              '      - caddy_data:/data' \
              '      - caddy_config:/config' \
              '    restart: always' \
              '' \
              'volumes:' \
              '  caddy_data:' \
              '  caddy_config:'
          } > "$D/docker-compose.yml"

          {
            printf '%s\n' \
              "${DOMAIN} {" \
              '    reverse_proxy web:3000' \
              '}'
          } > "$D/Caddyfile"

          printf '%s' "$EC2_WEB_ENV_FILE" > "$D/web.env"
        env:
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_USERNAME }}
          EC2_WEB_ENV_FILE: ${{ secrets.EC2_WEB_ENV_FILE }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}

      - name: Ensure /app exists on web EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WEB_EC2_IP }}
          username: ${{ vars.EC2_SSH_USER != '' && vars.EC2_SSH_USER || 'ec2-user' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /app
            sudo chown -R "$(whoami):$(whoami)" /app

      - name: Upload compose, Caddyfile, and .env to web EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.WEB_EC2_IP }}
          username: ${{ vars.EC2_SSH_USER != '' && vars.EC2_SSH_USER || 'ec2-user' }}
          key: ${{ secrets.SSH_KEY }}
          source: ec2-deploy-web/docker-compose.yml,ec2-deploy-web/Caddyfile,ec2-deploy-web/web.env
          strip_components: 1
          target: /app
          overwrite: true

      - name: Deploy web on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WEB_EC2_IP }}
          username: ${{ vars.EC2_SSH_USER != '' && vars.EC2_SSH_USER || 'ec2-user' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv -f /app/web.env /app/.env
            chmod 600 /app/.env
            cd /app
            docker compose pull web caddy
            docker compose up -d --remove-orphans web caddy

  deploy-workers:
    needs: build-and-push
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check workers deploy secrets
        env:
          HOST: ${{ secrets.WORKERS_EC2_IP }}
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "${HOST}" ]; then
            echo "::error::Set repository secret WORKERS_EC2_IP."
            exit 1
          fi
          if [ -z "${KEY}" ]; then
            echo "::error::Set repository secret SSH_KEY."
            exit 1
          fi

      - name: Prepare workers docker-compose.yml and workers.env
        run: |
          set -euo pipefail
          if [ -z "${EC2_WORKERS_ENV_FILE:-}" ]; then
            echo "::error::Set repository secret EC2_WORKERS_ENV_FILE."
            exit 1
          fi
          D="${GITHUB_WORKSPACE}/ec2-deploy-workers"
          mkdir -p "$D"
          NS="${DOCKERHUB_NS}"

          {
            printf '%s\n' \
              'services:' \
              '  executor:' \
              "    image: ${NS}/recruitai-executor-worker:latest" \
              '    env_file: .env' \
              '    restart: always' \
              '' \
              '  evaluator:' \
              "    image: ${NS}/recruitai-evaluator-worker:latest" \
              '    env_file: .env' \
              '    restart: always' \
              '' \
              '  cv-parser:' \
              "    image: ${NS}/recruitai-cv-parser-worker:latest" \
              '    env_file: .env' \
              '    restart: always'
          } > "$D/docker-compose.yml"

          printf '%s' "$EC2_WORKERS_ENV_FILE" > "$D/workers.env"
        env:
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_USERNAME }}
          EC2_WORKERS_ENV_FILE: ${{ secrets.EC2_WORKERS_ENV_FILE }}

      - name: Ensure /app exists on workers EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WORKERS_EC2_IP }}
          username: ${{ vars.EC2_SSH_USER != '' && vars.EC2_SSH_USER || 'ec2-user' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /app
            sudo chown -R "$(whoami):$(whoami)" /app

      - name: Upload compose and .env to workers EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.WORKERS_EC2_IP }}
          username: ${{ vars.EC2_SSH_USER != '' && vars.EC2_SSH_USER || 'ec2-user' }}
          key: ${{ secrets.SSH_KEY }}
          source: ec2-deploy-workers/docker-compose.yml,ec2-deploy-workers/workers.env
          strip_components: 1
          target: /app
          overwrite: true

      - name: Deploy workers on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WORKERS_EC2_IP }}
          username: ${{ vars.EC2_SSH_USER != '' && vars.EC2_SSH_USER || 'ec2-user' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv -f /app/workers.env /app/.env
            chmod 600 /app/.env
            cd /app
            docker compose pull executor evaluator cv-parser
            docker compose up -d --remove-orphans executor evaluator cv-parser
