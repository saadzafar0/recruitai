# Build all service images → Docker Hub → SSH deploy to two EC2 hosts (web + workers).
# See docs/deployment-ec2-docker.md
name: deploy-ec2

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: deploy-ec2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build-and-push:
    name: 'Image: ${{ matrix.image }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: nextjs-web, image: recruitai-nextjs-web }
          - { service: executor-worker, image: recruitai-executor-worker }
          - { service: cv-parser-worker, image: recruitai-cv-parser-worker }
          - { service: evaluator-worker, image: recruitai-evaluator-worker }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_USER" ]; then
            echo "::error::Set DOCKERHUB_USERNAME (repository variable or secret) to your Docker Hub namespace."
            exit 1
          fi
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ (vars.DOCKERHUB_USERNAME != '' && vars.DOCKERHUB_USERNAME) || 'unconfigured' }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ (github.ref_name == 'main' || github.ref_name == 'master') && github.event_name == 'push' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./services/${{ matrix.service }}
          push: ${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Digest ${{ steps.build.outputs.digest }}"

  deploy-web:
    needs: build-and-push
    if: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.WEB_EC2_IP != '' && secrets.SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy web EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WEB_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app
            docker compose pull
            docker compose up -d --remove-orphans

  deploy-workers:
    needs: build-and-push
    if: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.WORKERS_EC2_IP != '' && secrets.SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy workers EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WORKERS_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app
            docker compose pull
            docker compose up -d --remove-orphans
